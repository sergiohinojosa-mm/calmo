<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const list = [
      ['Respira como las olas', 'Para estar tranquila · 5 min', '#9CC5A1'],
      ['Suelta el aire despacito', 'Para calmarte · 3 min', '#6FA58A'],
      ['El triángulo', 'Para concentrarte · 3 min', '#E2CC94'],
      ['La caja', 'Antes de un examen · 3 min', '#E2CC94'],
      ['Respira para dormir', 'En la cama · 3 min', '#B9DEC3'],
      ['Dos sorbitos de aire', 'Si estás nerviosa · 2 min', '#6FA58A'],
      ['Destapa tu nariz', 'Si tienes la nariz tapada · 6 veces', '#E9DFC4'],
      ['Respira suavecito', 'Como un ratón · 5 min', '#E9DFC4'],
    ];
    return {
      items: list.map(([name, detail, color]) => ({
        name,
        detail,
        dot: 'width: 14px; height: 14px; flex: none; border-radius: 50%; background: ' + color + ';',
      })),
    };
  }
}
</script>
