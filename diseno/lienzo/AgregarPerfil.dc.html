<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Calmo · Agregar perfil</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&amp;family=Fraunces:opsz,wght,SOFT@9..144,300..600,0..100&amp;display=swap">
<style>
body{margin:0}
a{color:#9CC5A1}a:hover{color:#B9DEC3}
input::placeholder{color:#8A9B8F}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #101A15; color: #EEF3EC; font-family: 'Figtree', system-ui, sans-serif; box-sizing: border-box; padding: 56px 20px 0;">
  <div style="display: flex; align-items: center; gap: 14px;">
    <a href="SelectorPerfil.dc.html" aria-label="Volver" style="width: 44px; height: 44px; border-radius: 50%; background: #1C2B23; display: flex; align-items: center; justify-content: center; color: #EEF3EC;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-variation-settings: 'SOFT' 100, 'opsz' 72; font-weight: 400; font-size: 28px;">Agregar perfil</h1>
  </div>
  <p style="margin: 10px 0 0; font-size: 14px; line-height: 1.5; color: #A9B8AC;">Un perfil por persona que respira en este iPhone. Su práctica se guarda a su nombre.</p>

  <label style="display: block; margin-top: 22px;">
    <span style="display: block; font-size: 13px; color: #A9B8AC; margin-bottom: 8px;">Nombre</span>
    <input type="text" placeholder="Por ejemplo, Sofía" style="width: 100%; box-sizing: border-box; height: 52px; border-radius: 16px; border: 1px solid rgba(238,243,236,0.14); background: #16231C; color: #EEF3EC; padding: 0 16px; font-family: inherit; font-size: 17px;">
  </label>

  <div style="margin-top: 20px; display: flex; align-items: center; justify-content: space-between; background: #16231C; border-radius: 20px; padding: 12px 16px;">
    <div>
      <p style="margin: 0; font-size: 15px;">Edad</p>
      <p style="margin: 2px 0 0; font-size: 12px; color: #8A9B8F;">Sugiere el tipo de perfil</p>
    </div>
    <div style="display: flex; align-items: center; gap: 10px;">
      <button onClick="{{dec}}" aria-label="Un año menos" style="width: 48px; height: 48px; border-radius: 50%; border: 1px solid rgba(238,243,236,0.14); background: #1C2B23; color: #EEF3EC; font-size: 22px; font-family: inherit;">−</button>
      <span style="min-width: 48px; text-align: center; font-family: 'Fraunces', Georgia, serif; font-variation-settings: 'SOFT' 100; font-size: 28px; font-variant-numeric: tabular-nums;">{{edad}}</span>
      <button onClick="{{inc}}" aria-label="Un año más" style="width: 48px; height: 48px; border-radius: 50%; border: 1px solid rgba(238,243,236,0.14); background: #1C2B23; color: #EEF3EC; font-size: 22px; font-family: inherit;">+</button>
    </div>
  </div>

  <p style="margin: 22px 0 8px; font-size: 13px; color: #A9B8AC;">Tipo de perfil</p>
  <div role="group" aria-label="Tipo de perfil" style="display: flex; flex-direction: column; gap: 10px;">
    <sc-for list="{{tipos}}" as="t" hint-placeholder-count="3">
      <button onClick="{{t.pick}}" aria-pressed="{{t.pressed}}" style="{{t.style}}">
        <span style="display: flex; align-items: center; justify-content: space-between; gap: 8px;">
          <span style="font-size: 16px; font-weight: 600;">{{t.name}}</span>
          <sc-if value="{{t.suggested}}" hint-placeholder-val="{{false}}">
            <span style="padding: 3px 10px; border-radius: 999px; background: rgba(156,197,161,0.16); color: #B9DEC3; font-size: 12px;">Sugerido</span>
          </sc-if>
        </span>
        <span style="display: block; margin-top: 4px; font-size: 13px; line-height: 1.45; color: #A9B8AC;">{{t.desc}}</span>
      </button>
    </sc-for>
  </div>

  <p style="margin: 14px 0 0; display: flex; align-items: center; gap: 8px; font-size: 13px; color: #A9B8AC;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none;"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
    {{pinNote}}
  </p>

  <a href="SelectorPerfil.dc.html" style="position: absolute; left: 20px; right: 20px; bottom: 34px; display: flex; align-items: center; justify-content: center; height: 58px; border-radius: 999px; background: #9CC5A1; color: #0F1A14; font-size: 17px; font-weight: 600; text-decoration: none;">Guardar perfil</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const edad = st.edad ?? 8;
    const sugerido = edad <= 6 ? 'peque' : edad <= 12 ? 'junior' : 'adulto';
    const tipo = st.tipo ?? sugerido;
    const T = [
      { k: 'peque', name: 'Peque', desc: 'Hasta 6 años. Juegos de 1 a 3 minutos, con un adulto.' },
      { k: 'junior', name: 'Junior', desc: 'De 7 a 12 años. Palabras de niña, retos suaves y logros.' },
      { k: 'adulto', name: 'Adulto', desc: 'Catálogo completo, metas y rutinas propias.' },
    ];
    const tipos = T.map((t) => ({
      name: t.name,
      desc: t.desc,
      suggested: t.k === sugerido,
      pressed: t.k === tipo ? 'true' : 'false',
      style: 'text-align: left; width: 100%; min-height: 64px; padding: 12px 16px; border-radius: 20px; font-family: inherit; color: #EEF3EC; background: ' + (t.k === tipo ? 'rgba(156,197,161,0.14)' : '#16231C') + '; border: ' + (t.k === tipo ? '2px solid #9CC5A1' : '1px solid rgba(238,243,236,0.06)') + ';',
      pick: () => this.setState({ tipo: t.k }),
    }));
    return {
      edad,
      tipos,
      pinNote: tipo === 'adulto' ? 'Los adultos crean su PIN la primera vez que entran.' : 'Las niñas entran a su perfil sin PIN.',
      dec: () => this.setState({ edad: Math.max(3, edad - 1), tipo: undefined }),
      inc: () => this.setState({ edad: Math.min(99, edad + 1), tipo: undefined }),
    };
  }
}
</script>
</body>
</html>
