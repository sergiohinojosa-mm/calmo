<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const days = ['M', 'J', 'V', 'S', 'D', 'L', 'Hoy'];
    const got = [0, 1, 0, 1, 1, 1, 'hoy'];
    const stars = days.map((day, i) => {
      const v = got[i];
      const today = v === 'hoy';
      return {
        day,
        fill: v === 1 ? '#E2CC94' : 'none',
        stroke: v === 1 ? '#E2CC94' : today ? '#9CC5A1' : '#5E6E63',
        labelStyle: 'font-size: 12px; ' + (today ? 'color: #9CC5A1; font-weight: 600;' : 'color: #8A9B8F;'),
      };
    });
    return { stars };
  }
}
</script>
