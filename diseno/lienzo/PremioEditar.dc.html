<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Calmo · Editar premio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&amp;family=Fraunces:opsz,wght,SOFT@9..144,300..600,0..100&amp;display=swap">
<style>
body{margin:0}
a{color:#9CC5A1}a:hover{color:#B9DEC3}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #101A15; color: #EEF3EC; font-family: 'Figtree', system-ui, sans-serif;">
  <div aria-hidden="true" style="position: absolute; inset: 0; padding: 60px 20px; box-sizing: border-box;">
    <p style="margin: 0 0 0 58px; font-family: 'Fraunces', Georgia, serif; font-variation-settings: 'SOFT' 100; font-size: 28px;">Premios</p>
    <div style="margin-top: 36px; height: 130px; border-radius: 22px; background: #1C2B23;"></div>
    <div style="margin-top: 10px; height: 130px; border-radius: 22px; background: #1C2B23;"></div>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(5,10,8,0.62);"></div>

  <div role="dialog" aria-label="Editar premio" style="position: absolute; left: 0; right: 0; bottom: 0; top: 120px; background: #1C2B23; border-radius: 28px 28px 0 0; padding: 12px 20px 34px; box-sizing: border-box; display: flex; flex-direction: column;">
    <div style="width: 36px; height: 4px; border-radius: 4px; background: rgba(238,243,236,0.18); margin: 0 auto 14px;"></div>
    <div style="display: flex; align-items: center; justify-content: space-between;">
      <h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-variation-settings: 'SOFT' 100, 'opsz' 48; font-weight: 400; font-size: 26px;">Premio</h1>
      <a href="PremiosAdmin.dc.html" aria-label="Cerrar" style="width: 44px; height: 44px; border-radius: 50%; background: #16231C; display: flex; align-items: center; justify-content: center; color: #A9B8AC;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
      </a>
    </div>

    <div style="flex: 1; min-height: 0; overflow-y: auto; margin-top: 14px;">
      <label style="display: block;">
        <span style="display: block; font-size: 13px; color: #A9B8AC; margin-bottom: 8px;">Nombre del premio</span>
        <input type="text" value="Ir por un helado" placeholder="Elegir la película del viernes" style="width: 100%; box-sizing: border-box; min-height: 52px; border-radius: 16px; border: 1px solid rgba(238,243,236,0.12); background: #101A15; color: #EEF3EC; padding: 0 16px; font-family: inherit; font-size: 16px;">
      </label>

      <p style="margin: 20px 0 8px; font-size: 13px; color: #A9B8AC;">Cuesta</p>
      <div style="display: flex; align-items: center; justify-content: space-between; background: #16231C; border-radius: 20px; padding: 10px 14px;">
        <button onClick="{{dec}}" aria-label="Bajar 10 hojas" style="width: 52px; height: 52px; border-radius: 50%; border: 1px solid rgba(238,243,236,0.14); background: #1C2B23; color: #EEF3EC; font-size: 22px; font-family: inherit;">−</button>
        <span style="display: inline-flex; align-items: center; gap: 8px; font-family: 'Fraunces', Georgia, serif; font-variation-settings: 'SOFT' 100; font-size: 32px; font-variant-numeric: tabular-nums;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#B9DEC3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19c0-8 5-14 15-14 0 10-6 15-14 15"></path><path d="M5 19 13 11"></path></svg>
          {{cost}}
          <span style="font-family: 'Figtree', sans-serif; font-size: 14px; color: #A9B8AC;">hojas</span>
        </span>
        <button onClick="{{inc}}" aria-label="Subir 10 hojas" style="width: 52px; height: 52px; border-radius: 50%; border: 1px solid rgba(238,243,236,0.14); background: #1C2B23; color: #EEF3EC; font-size: 22px; font-family: inherit;">+</button>
      </div>
      <p style="margin: 8px 0 0; font-size: 12px; color: #8A9B8F;">{{hint}}</p>

      <p style="margin: 20px 0 8px; font-size: 13px; color: #A9B8AC;">Lo ven</p>
      <div style="display: flex; gap: 8px; flex-wrap: wrap;">
        <sc-for list="{{kids}}" as="k" hint-placeholder-count="2">
          <button onClick="{{k.toggle}}" aria-pressed="{{k.pressed}}" style="{{k.style}}">{{k.label}}</button>
        </sc-for>
      </div>
      <p style="margin: 8px 0 0; font-size: 12px; color: #8A9B8F;">Julia gana estrellas; sus premios llegarán más adelante.</p>
    </div>

    <div style="display: flex; flex-direction: column; gap: 10px; margin-top: 14px;">
      <a href="PremiosAdmin.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 999px; background: #9CC5A1; color: #0F1A14; font-size: 17px; font-weight: 600; text-decoration: none;">Guardar</a>
      <sc-if value="{{askOff}}" hint-placeholder-val="{{false}}">
        <div style="padding: 12px 14px; border-radius: 18px; background: rgba(233,178,125,0.10); display: flex; align-items: center; justify-content: space-between; gap: 10px;">
          <span style="font-size: 14px; color: #E9B27D;">¿Desactivar este premio?</span>
          <span style="display: flex; gap: 6px;">
            <button onClick="{{cancelOff}}" style="min-height: 44px; padding: 0 12px; border-radius: 999px; border: 1px solid rgba(238,243,236,0.14); background: transparent; color: #EEF3EC; font-family: inherit; font-size: 13px;">No</button>
            <a href="PremiosAdmin.dc.html" style="min-height: 44px; padding: 0 14px; box-sizing: border-box; border-radius: 999px; background: #E9B27D; color: #0F1A14; font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; text-decoration: none;">Sí, desactivar</a>
          </span>
        </div>
      </sc-if>
      <sc-if value="{{showOff}}" hint-placeholder-val="{{true}}">
        <button onClick="{{askOffFn}}" style="min-height: 48px; border-radius: 999px; border: 1px solid rgba(233,178,125,0.35); background: transparent; color: #E9B27D; font-family: inherit; font-size: 15px;">Desactivar premio</button>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const cost = st.cost ?? 150;
    const vis = st.vis ?? { luciana: true, mariel: true };
    const on = 'min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #9CC5A1; background: rgba(156,197,161,0.16); color: #B9DEC3; font-family: inherit; font-size: 14px; font-weight: 600;';
    const off = 'min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid rgba(238,243,236,0.14); background: transparent; color: #A9B8AC; font-family: inherit; font-size: 14px;';
    const kids = [['luciana', 'Luciana · Junior'], ['mariel', 'Mariel · Junior']].map(([k, label]) => ({
      label,
      pressed: vis[k] ? 'true' : 'false',
      style: vis[k] ? on : off,
      toggle: () => this.setState({ vis: Object.assign({}, vis, { [k]: !vis[k] }) }),
    }));
    const days = Math.max(1, Math.round(cost / 15));
    return {
      cost,
      kids,
      hint: 'Con unos 15 minutos al día, se gana en ' + days + (days === 1 ? ' día' : ' días') + '.',
      dec: () => this.setState({ cost: Math.max(10, cost - 10) }),
      inc: () => this.setState({ cost: Math.min(2000, cost + 10) }),
      askOff: !!st.askOff,
      showOff: !st.askOff,
      askOffFn: () => this.setState({ askOff: true }),
      cancelOff: () => this.setState({ askOff: false }),
    };
  }
}
</script>
</body>
</html>
