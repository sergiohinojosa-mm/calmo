<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Calmo · Serie de retenciones caminando</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&amp;family=Fraunces:opsz,wght,SOFT@9..144,300..600,0..100&amp;display=swap">
<style>
body{margin:0}
a{color:#9CC5A1}a:hover{color:#B9DEC3}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #0C1410; color: #EEF3EC; font-family: 'Figtree', system-ui, sans-serif; box-sizing: border-box; padding: 56px 20px 0;">
  <div style="display: flex; align-items: center; justify-content: space-between; position: relative; z-index: 3;">
    <a href="{{backHref}}" aria-label="{{closeLabel}}" style="width: 44px; height: 44px; border-radius: 50%; background: rgba(238,243,236,0.06); display: flex; align-items: center; justify-content: center; color: #A9B8AC;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
    </a>
    <div style="text-align: center;">
      <p style="margin: 0; font-size: 14px; font-weight: 500;">{{title}}</p>
      <p style="margin: 2px 0 0; font-size: 12px; color: #8A9B8F;">{{subtitle}}</p>
    </div>
    <span style="width: 44px;"></span>
  </div>

  <sc-if value="{{isHold}}" hint-placeholder-val="{{false}}">
    <button onClick="{{endHold}}" aria-label="{{holdAria}}" style="position: absolute; inset: 0; z-index: 2; width: 100%; height: 100%; border: none; background: #0C1410; color: #EEF3EC; font-family: inherit; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 0 36px;">
      <span style="font-size: 15px; color: #A9B8AC;">{{holdLine}}</span>
      <span style="font-family: 'Fraunces', Georgia, serif; font-variation-settings: 'SOFT' 100, 'opsz' 144; font-size: 96px; line-height: 1; font-variant-numeric: tabular-nums;">{{holdClock}}</span>
      <span style="margin-top: 18px; font-family: 'Fraunces', Georgia, serif; font-variation-settings: 'SOFT' 100; font-size: 24px; line-height: 1.3; text-align: center;">{{holdTap}}</span>
      <span style="font-size: 14px; color: #A9B8AC; text-align: center;">{{holdSub}}</span>
    </button>
  </sc-if>

  <div style="margin-top: 22px; display: flex; flex-direction: column; align-items: center;">
    <svg width="200" height="200" viewBox="0 0 220 220" role="img" aria-label="{{ringLabel}}">
      <circle cx="110" cy="110" r="96" fill="none" stroke="rgba(238,243,236,0.07)" stroke-width="10"></circle>
      <circle cx="110" cy="110" r="96" fill="none" stroke="#9CC5A1" stroke-width="10" stroke-linecap="round" stroke-dasharray="603" stroke-dashoffset="{{dash}}" transform="rotate(-90 110 110)"></circle>
      <text x="110" y="112" text-anchor="middle" font-family="Fraunces, Georgia, serif" font-size="56" fill="#EEF3EC">{{clock}}</text>
      <text x="110" y="142" text-anchor="middle" font-family="Figtree, sans-serif" font-size="13" fill="#A9B8AC">{{ringSub}}</text>
    </svg>
    <p style="margin: 8px 0 0; font-size: 14px; line-height: 1.45; color: #A9B8AC; text-align: center;">{{hint}}</p>
  </div>

  <div style="margin-top: 16px; background: #1C2B23; border: 1px solid rgba(238,243,236,0.06); border-radius: 22px; padding: 12px 16px;">
    <p style="margin: 0 0 8px; font-size: 13px; color: #A9B8AC;">{{barsTitle}}</p>
    <div style="display: flex; align-items: flex-end; gap: 8px; height: 64px;">
      <sc-for list="{{bars}}" as="b" hint-placeholder-count="8">
        <div style="flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;">
          <span style="font-size: 11px; color: #A9B8AC; font-variant-numeric: tabular-nums;">{{b.v}}</span>
          <div style="{{b.style}}"></div>
        </div>
      </sc-for>
    </div>
  </div>

  <div style="margin-top: 12px; background: #16231C; border-radius: 22px; padding: 10px 12px;">
    <p style="margin: 0 0 6px 4px; font-size: 13px; color: #A9B8AC;">{{countLabel}}</p>
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 6px;">
      <button onClick="{{dec5}}" aria-label="Cinco pasos menos" style="width: 52px; height: 48px; border-radius: 16px; border: 1px solid rgba(238,243,236,0.14); background: #1C2B23; color: #EEF3EC; font-size: 15px; font-family: inherit;">−5</button>
      <button onClick="{{dec}}" aria-label="Un paso menos" style="width: 52px; height: 48px; border-radius: 16px; border: 1px solid rgba(238,243,236,0.14); background: #1C2B23; color: #EEF3EC; font-size: 15px; font-family: inherit;">−1</button>
      <span style="flex: 1; text-align: center; font-family: 'Fraunces', Georgia, serif; font-variation-settings: 'SOFT' 100; font-size: 32px; font-variant-numeric: tabular-nums;">{{cur}}</span>
      <button onClick="{{inc}}" aria-label="Un paso más" style="width: 52px; height: 48px; border-radius: 16px; border: 1px solid rgba(238,243,236,0.14); background: #1C2B23; color: #EEF3EC; font-size: 15px; font-family: inherit;">+1</button>
      <button onClick="{{inc5}}" aria-label="Cinco pasos más" style="width: 52px; height: 48px; border-radius: 16px; border: 1px solid rgba(238,243,236,0.14); background: #1C2B23; color: #EEF3EC; font-size: 15px; font-family: inherit;">+5</button>
    </div>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 36px; display: flex; gap: 10px;">
    <a href="{{backHref}}" style="flex: 1; display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 999px; border: 1px solid rgba(238,243,236,0.14); color: #A9B8AC; font-size: 15px; text-decoration: none;">Salir</a>
    <sc-if value="{{isLast}}" hint-placeholder-val="{{false}}">
      <a href="Resumen.dc.html" style="flex: 2; display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 999px; background: #9CC5A1; color: #0F1A14; font-size: 16px; font-weight: 600; text-decoration: none;">Terminar serie</a>
    </sc-if>
    <sc-if value="{{notLast}}" hint-placeholder-val="{{true}}">
      <button onClick="{{next}}" aria-disabled="{{waiting}}" style="{{nextStyle}}">{{nextLabel}}</button>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"bolt":{"editor":"int","default":24,"min":5,"max":60,"unit":"s"},"junior":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.setState({ phase: 'recover', left: 60, holdT: 0 });
    this.iv = setInterval(() => {
      const st = this.state || {};
      if (st.phase === 'hold') this.setState({ holdT: (st.holdT || 0) + 1 });
      else if ((st.left ?? 60) > 0) this.setState({ left: (st.left ?? 60) - 1 });
    }, 1000);
  }
  componentWillUnmount() { clearInterval(this.iv); }
  renderVals() {
    const st = this.state || {};
    const kid = !!this.props.junior;
    const bolt = this.props.bolt ?? 24;
    const strong = !kid && bolt >= 20;
    const phase = st.phase ?? 'recover';
    const done = st.done ?? [38, 41, 44, 42];
    const cur = st.cur ?? done[done.length - 1];
    const left = st.left ?? 60;
    const total = 60;
    const waiting = left > 0;
    const round = done.length + 1;
    const all = done.concat([cur]);
    const isLast = round >= 8 && phase === 'recover';
    const word = kid ? 'Vuelta' : 'Retención';
    const max = 60;
    const bars = Array.from({ length: 8 }, (_, i) => {
      const v = all[i];
      const isCur = i === all.length - 1;
      return {
        v: v === undefined ? '' : v,
        style: 'width: 100%; max-width: 26px; border-radius: 8px; height: ' + (v === undefined ? 4 : Math.max(6, Math.round((v / max) * 44))) + 'px; background: ' + (v === undefined ? 'rgba(238,243,236,0.07)' : isCur ? '#9CC5A1' : 'rgba(156,197,161,0.40)') + ';',
      };
    });
    const mm = Math.floor(left / 60), ss = String(left % 60).padStart(2, '0');
    const ht = st.holdT || 0;
    const back = kid ? 'PerfilJunior.dc.html' : 'Perfil.dc.html';
    return {
      title: kid ? 'Vueltas caminando' : 'Retenciones caminando',
      subtitle: kid ? 'Vuelta ' + round + ' de 8' : 'Retención ' + round + ' de 8 · ' + (strong ? 'fuerte' : 'moderada'),
      backHref: back,
      closeLabel: kid ? 'Salir de las vueltas' : 'Salir de la serie',
      isHold: phase === 'hold',
      holdAria: kid ? 'Ya respiré' : 'Ya respiré: terminar la retención',
      holdLine: kid ? 'Camina y cuenta tus pasos' : 'Camina contando tus pasos',
      holdClock: Math.floor(ht / 60) + ':' + String(ht % 60).padStart(2, '0'),
      holdTap: 'Toca cuando respires',
      holdSub: kid ? 'Para cuando quieras respirar.' : (strong ? 'Detente con una falta de aire fuerte.' : 'Detente con una falta de aire moderada.'),
      endHold: () => this.setState({ phase: 'recover', left: total, cur: done.length ? done[done.length - 1] : 30 }),
      round, cur, bars,
      clock: mm + ':' + ss,
      ringSub: kid ? 'descansa por la nariz' : 'recupera por la nariz',
      dash: Math.round(603 * (1 - left / total)),
      ringLabel: (kid ? 'Descanso' : 'Recuperación') + ': quedan ' + left + ' segundos',
      hint: waiting
        ? (kid ? 'Descansa 60 segundos respirando por la nariz.' : 'Respira normal por la nariz y camina tranquilo. Recuperarte también es parte del ejercicio.')
        : (isLast ? (kid ? '¡Terminaste tus 8 vueltas!' : 'Terminaste las 8 retenciones.') : (kid ? 'Listo. Saca el aire suave por la nariz, tápate la nariz y camina.' : 'Ya te recuperaste. Exhala, tápate la nariz y vuelve a caminar.')),
      barsTitle: kid ? 'Pasos por vuelta' : 'Pasos por retención',
      countLabel: '¿Cuántos pasos diste en la ' + (kid ? 'vuelta ' : 'retención ') + round + '?',
      isLast,
      notLast: !isLast,
      waiting: waiting ? 'true' : 'false',
      nextLabel: waiting ? (kid ? 'Descansando · ' : 'Recuperando · ') + mm + ':' + ss : (kid ? 'Siguiente vuelta' : 'Siguiente retención'),
      nextStyle: 'flex: 2; height: 56px; border-radius: 999px; border: none; font-family: inherit; font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; ' + (waiting ? 'background: rgba(156,197,161,0.18); color: #B9DEC3;' : 'background: #9CC5A1; color: #0F1A14;'),
      dec5: () => this.setState({ cur: Math.max(0, cur - 5) }),
      dec: () => this.setState({ cur: Math.max(0, cur - 1) }),
      inc: () => this.setState({ cur: cur + 1 }),
      inc5: () => this.setState({ cur: cur + 5 }),
      next: () => { if (!waiting) this.setState({ done: all, cur, phase: 'hold', holdT: 0 }); },
    };
  }
}
</script>
</body>
</html>
