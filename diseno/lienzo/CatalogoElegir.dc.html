<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Calmo · Elige un ejercicio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&amp;family=Fraunces:opsz,wght,SOFT@9..144,300..600,0..100&amp;display=swap">
<style>
body{margin:0}
a{color:#9CC5A1}a:hover{color:#B9DEC3}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #101A15; color: #EEF3EC; font-family: 'Figtree', system-ui, sans-serif;">
  <div style="position: absolute; top: 56px; left: 20px; right: 20px; display: flex; align-items: center; gap: 14px;">
    <a href="{{volver}}" aria-label="Volver" style="width: 44px; height: 44px; flex: none; border-radius: 50%; background: #1C2B23; display: flex; align-items: center; justify-content: center; color: #EEF3EC;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <div style="flex: 1;">
      <h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-variation-settings: 'SOFT' 100, 'opsz' 72; font-weight: 400; font-size: 28px; line-height: 1.1;">{{titulo}}</h1>
      <p style="margin: 2px 0 0; font-size: 13px; color: #A9B8AC;">{{countLabel}}</p>
    </div>
  </div>

  <div role="group" aria-label="Filtrar por objetivo" style="position: absolute; top: 120px; left: 0; right: 0; display: flex; gap: 8px; overflow-x: auto; padding: 0 20px; box-sizing: border-box;">
    <sc-for list="{{chips}}" as="c" hint-placeholder-count="7">
      <button onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="{{c.style}}">{{c.label}}</button>
    </sc-for>
  </div>

  <div style="position: absolute; top: 180px; left: 0; right: 0; bottom: 0; overflow-y: auto; padding: 4px 20px 40px; box-sizing: border-box;">
    <sc-if value="{{hasGeneral}}" hint-placeholder-val="{{true}}">
      <p style="margin: 0 0 10px; font-size: 13px; color: #A9B8AC;">Técnicas de respiración</p>
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <sc-for list="{{general}}" as="e" hint-placeholder-count="6">
          <a href="{{volver}}" aria-label="{{e.aria}}" style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: #1C2B23; border: 1px solid rgba(238,243,236,0.06); border-radius: 20px; text-decoration: none; color: #EEF3EC;">
            <span style="{{e.halo}}"><span style="{{e.core}}"></span></span>
            <span style="flex: 1; min-width: 0;">
              <span style="display: block; font-size: 15px; font-weight: 600;">{{e.n}}</span>
              <span style="display: block; margin-top: 2px; font-size: 13px; color: #A9B8AC;">{{e.pat}}</span>
              <span style="display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px;">
                <span style="{{e.tagStyle}}">{{e.tag}}</span>
                <sc-if value="{{e.hasWarn}}" hint-placeholder-val="{{false}}">
                  <span style="padding: 3px 9px; border-radius: 999px; font-size: 12px; background: rgba(238,243,236,0.06); color: #A9B8AC;">{{e.warn}}</span>
                </sc-if>
              </span>
            </span>
            <span style="flex: none; height: 44px; padding: 0 14px; box-sizing: border-box; border-radius: 999px; border: 1px solid rgba(156,197,161,0.5); color: #B9DEC3; font-size: 13px; font-weight: 600; display: flex; align-items: center;">Elegir</span>
          </a>
        </sc-for>
      </div>
    </sc-if>

    <sc-if value="{{hasReducida}}" hint-placeholder-val="{{true}}">
      <p style="margin: 24px 0 4px; font-size: 13px; color: #A9B8AC;">Respiración reducida</p>
      <p style="margin: 0 0 10px; font-size: 12px; color: #8A9B8F;">Oxygen Advantage y Buteyko: respirar menos aire, con suavidad.</p>
      <div style="display: flex; flex-direction: column; gap: 10px;">
        <sc-for list="{{reducida}}" as="e" hint-placeholder-count="2">
          <a href="{{volver}}" aria-label="{{e.aria}}" style="display: flex; align-items: center; gap: 14px; padding: 14px 16px; background: #1C2B23; border: 1px solid rgba(238,243,236,0.06); border-radius: 20px; text-decoration: none; color: #EEF3EC;">
            <span style="{{e.halo}}"><span style="{{e.core}}"></span></span>
            <span style="flex: 1; min-width: 0;">
              <span style="display: block; font-size: 15px; font-weight: 600;">{{e.n}}</span>
              <span style="display: block; margin-top: 2px; font-size: 13px; color: #A9B8AC;">{{e.pat}}</span>
              <span style="display: flex; gap: 6px; margin-top: 8px;">
                <span style="{{e.tagStyle}}">{{e.tag}}</span>
              </span>
            </span>
            <span style="flex: none; height: 44px; padding: 0 14px; box-sizing: border-box; border-radius: 999px; border: 1px solid rgba(156,197,161,0.5); color: #B9DEC3; font-size: 13px; font-weight: 600; display: flex; align-items: center;">Elegir</span>
          </a>
        </sc-for>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"volver":{"editor":"text","default":"Planear.dc.html"},"titulo":{"editor":"text","default":"Elige un ejercicio"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const f = st.f ?? 'todos';
    const C = {
      enfoque: ['#E2CC94', 'rgba(226,204,148,0.14)', 'Enfoque'],
      calma: ['#6FA58A', 'rgba(111,165,138,0.18)', 'Calma'],
      dormir: ['#B9DEC3', 'rgba(185,222,195,0.14)', 'Dormir'],
      equilibrio: ['#9CC5A1', 'rgba(156,197,161,0.14)', 'Equilibrio'],
      bolt: ['#E9DFC4', 'rgba(233,223,196,0.14)', 'BOLT'],
      nariz: ['#9CC5A1', 'rgba(156,197,161,0.14)', 'Nariz tapada'],
    };
    const X = [
      { n: 'Respiración coherente', pat: '5.5 · 5.5 · unas 6 por minuto', c: 'equilibrio', keys: ['equilibrio', 'calma'], g: 'general' },
      { n: 'Exhalación larga 5-8', pat: '5 · 8 · variante 4-6', c: 'calma', keys: ['calma', 'dormir'], g: 'general' },
      { n: 'Triángulo', pat: '4 · 4 · 4', c: 'enfoque', keys: ['enfoque'], g: 'general' },
      { n: 'Respiración alterna', pat: '4 · 4 · 4 · alternando lado', c: 'equilibrio', keys: ['equilibrio'], g: 'general' },
      { n: 'Respiración cuadrada', pat: '4 · 4 · 4 · 4', c: 'enfoque', keys: ['enfoque'], g: 'general', warn: 'BOLT ≥ 10' },
      { n: '4-7-8', pat: '4 · 7 · 8', c: 'dormir', keys: ['dormir', 'calma'], g: 'general', warn: 'BOLT ≥ 10' },
      { n: 'Suspiro cíclico', pat: '2 + 1 · 6, todo por la nariz', c: 'calma', keys: ['calma'], g: 'general' },
      { n: 'Destapar la nariz', pat: '5 a 6 repeticiones guiadas', c: 'nariz', keys: ['nariz'], g: 'general' },
      { n: 'Retenciones caminando', pat: '6 a 10 retenciones · 60 s de recuperación entre cada una', c: 'bolt', keys: ['bolt'], g: 'general' },
      { n: 'Respira ligero en reposo', pat: 'Bloques de 4 min + 1 min normal', c: 'bolt', keys: ['bolt', 'calma'], g: 'reducida' },
      { n: 'Respiración reducida con pausas de control', pat: '3 rondas · mide antes y después', c: 'bolt', keys: ['bolt'], g: 'reducida' },
    ];
    const shown = X.filter((x) => f === 'todos' || x.keys.indexOf(f) >= 0).map((x) => {
      const [col, tint, tag] = C[x.c];
      return {
        n: x.n, pat: x.pat, tag,
        aria: 'Elegir ' + x.n,
        hasWarn: !!x.warn, warn: x.warn || '',
        g: x.g,
        halo: 'width: 40px; height: 40px; flex: none; border-radius: 50%; background: ' + tint + '; display: flex; align-items: center; justify-content: center;',
        core: 'width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid ' + col + ';',
        tagStyle: 'padding: 3px 9px; border-radius: 999px; font-size: 12px; background: ' + tint + '; color: ' + col + ';',
      };
    });
    const general = shown.filter((x) => x.g === 'general');
    const reducida = shown.filter((x) => x.g === 'reducida');
    const F = [['todos', 'Todos'], ['enfoque', 'Enfoque'], ['calma', 'Calma'], ['dormir', 'Dormir'], ['equilibrio', 'Equilibrio'], ['bolt', 'BOLT'], ['nariz', 'Nariz tapada']];
    const chips = F.map(([k, label]) => ({
      label,
      pressed: k === f ? 'true' : 'false',
      style: k === f
        ? 'flex: none; height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid #9CC5A1; background: #9CC5A1; color: #0F1A14; font-family: inherit; font-size: 14px; font-weight: 600;'
        : 'flex: none; height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid rgba(238,243,236,0.10); background: #16231C; color: #EEF3EC; font-family: inherit; font-size: 14px;',
      pick: () => this.setState({ f: k }),
    }));
    return {
      volver: this.props.volver ?? 'Planear.dc.html',
      titulo: this.props.titulo ?? 'Elige un ejercicio',
      chips, general, reducida,
      hasGeneral: general.length > 0,
      hasReducida: reducida.length > 0,
      countLabel: shown.length + (shown.length === 1 ? ' ejercicio' : ' ejercicios'),
    };
  }
}
</script>
</body>
</html>
