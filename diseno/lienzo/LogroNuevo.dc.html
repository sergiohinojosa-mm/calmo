<style>
body{margin:0}
a{color:#9CC5A1}a:hover{color:#B9DEC3}
@keyframes calmo-fall{0%{transform:translateY(-60px) rotate(0deg);opacity:0}10%{opacity:0.9}100%{transform:translateY(900px) rotate(320deg);opacity:0}}
.calmo-fall{position:absolute;top:0;animation-name:calmo-fall;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes calmo-pop{0%{transform:scale(0.55);opacity:0}70%{transform:scale(1.06);opacity:1}100%{transform:scale(1);opacity:1}}
.calmo-pop{animation:calmo-pop 0.9s cubic-bezier(.3,.7,.4,1) both}
@keyframes calmo-glow{0%,100%{transform:scale(0.96);opacity:0.6}50%{transform:scale(1.04);opacity:1}}
.calmo-glow{animation:calmo-glow 3.5s ease-in-out infinite}

</style>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const shared = !!(this.state && this.state.shared);
    return {
      shared,
      sharedPressed: shared ? 'true' : 'false',
      shareLabel: shared ? 'Enviado a tu familia' : 'Contarle a mi familia',
      shareStyle: 'flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px; height: 56px; border-radius: 999px; font-family: inherit; font-size: 15px; ' + (shared ? 'border: 1px solid rgba(156,197,161,0.5); background: rgba(156,197,161,0.12); color: #B9DEC3;' : 'border: 1px solid rgba(238,243,236,0.16); background: transparent; color: #EEF3EC;'),
      share: () => this.setState({ shared: true }),
    };
  }
}
</script>
