<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Calmo · Nota para Marcela</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&amp;family=Fraunces:opsz,wght,SOFT@9..144,300..600,0..100&amp;display=swap">
<style>
body{margin:0}
a{color:#9CC5A1}a:hover{color:#B9DEC3}
textarea::placeholder{color:#8A9B8F}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #101A15; color: #EEF3EC; font-family: 'Figtree', system-ui, sans-serif;">
  <div aria-hidden="true" style="position: absolute; top: 56px; left: 20px; right: 20px; display: flex; align-items: center; gap: 12px;">
    <span style="width: 44px; height: 44px; border-radius: 50%; background: #1C2B23;"></span>
    <span style="width: 52px; height: 52px; border-radius: 50%; background: rgba(226,204,148,0.20); color: #E2CC94; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 600;">M</span>
    <span style="font-family: 'Fraunces', Georgia, serif; font-variation-settings: 'SOFT' 100; font-size: 28px;">Marcela</span>
  </div>
  <div aria-hidden="true" style="position: absolute; top: 130px; left: 20px; right: 20px; height: 150px; border-radius: 28px; background: #1C2B23;"></div>
  <div style="position: absolute; inset: 0; background: rgba(5,10,8,0.62);"></div>

  <div role="dialog" aria-label="Nota para Marcela" style="position: absolute; left: 0; right: 0; bottom: 0; box-sizing: border-box; padding: 10px 20px 34px; background: #1C2B23; border-radius: 28px 28px 0 0;">
    <div style="width: 40px; height: 5px; border-radius: 3px; background: rgba(238,243,236,0.20); margin: 0 auto 8px;"></div>
    <div style="display: flex; justify-content: space-between; align-items: center;">
      <h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-variation-settings: 'SOFT' 100, 'opsz' 48; font-weight: 400; font-size: 24px;">Nota para Marcela</h1>
      <a href="MaestraDetalle.dc.html" aria-label="Cerrar" style="width: 44px; height: 44px; border-radius: 50%; background: rgba(238,243,236,0.06); display: flex; align-items: center; justify-content: center; color: #A9B8AC;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
      </a>
    </div>
    <p style="margin: 6px 0 0; font-size: 13px; color: #A9B8AC;">La verá en su Inicio, en la tarjeta «De Pamela».</p>

    <p style="margin: 16px 0 8px; font-size: 13px; color: #A9B8AC;">Notas rápidas</p>
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <sc-for list="{{rapidas}}" as="r" hint-placeholder-count="3">
        <button onClick="{{r.pick}}" aria-pressed="{{r.pressed}}" style="{{r.style}}">{{r.t}}</button>
      </sc-for>
    </div>

    <label style="display: block; margin-top: 16px; font-size: 13px; color: #A9B8AC;">O escribe la tuya
      <textarea value="{{texto}}" onChange="{{onTexto}}" placeholder="Esta semana practica antes de dormir." style="display: block; box-sizing: border-box; width: 100%; height: 96px; margin-top: 8px; padding: 12px 14px; border-radius: 16px; border: 1px solid rgba(238,243,236,0.10); background: #16231C; color: #EEF3EC; font-family: inherit; font-size: 15px; line-height: 1.5; resize: none;"></textarea>
    </label>

    <div style="margin-top: 18px;">
      <sc-if value="{{listo}}" hint-placeholder-val="{{false}}">
        <a href="MaestraDetalle.dc.html" style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 56px; border-radius: 999px; background: #9CC5A1; color: #0F1A14; font-size: 17px; font-weight: 600; text-decoration: none;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12l16-8-6 16-2-6z"></path></svg>
          Enviar
        </a>
      </sc-if>
      <sc-if value="{{vacio}}" hint-placeholder-val="{{true}}">
        <sc-if value="{{avisar}}" hint-placeholder-val="{{false}}">
          <p role="status" style="margin: 0 0 8px; text-align: center; font-size: 13px; color: #E2CC94;">Elige una nota rápida o escribe la tuya</p>
        </sc-if>
        <button onClick="{{nudge}}" aria-disabled="true" style="width: 100%; height: 56px; border-radius: 999px; border: none; background: #9CC5A1; opacity: 0.4; color: #0F1A14; font-family: inherit; font-size: 17px; font-weight: 600;">Enviar</button>
      </sc-if>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const texto = st.texto ?? '';
    const R = ['¡Vas muy bien!', 'Mantén la boca cerrada al caminar.', 'Practica antes de dormir.'];
    const on = 'min-height: 48px; padding: 0 16px; border-radius: 16px; border: 1px solid #9CC5A1; background: rgba(156,197,161,0.16); color: #EEF3EC; font-family: inherit; font-size: 15px; font-weight: 600; text-align: left;';
    const off = 'min-height: 48px; padding: 0 16px; border-radius: 16px; border: 1px solid rgba(238,243,236,0.08); background: #16231C; color: #EEF3EC; font-family: inherit; font-size: 15px; text-align: left;';
    const listo = texto.trim().length > 0;
    return {
      texto,
      rapidas: R.map((t) => ({
        t,
        pressed: texto === t ? 'true' : 'false',
        style: texto === t ? on : off,
        pick: () => this.setState({ texto: t, avisar: false }),
      })),
      onTexto: (e) => this.setState({ texto: e.target.value, avisar: false }),
      listo,
      vacio: !listo,
      avisar: !!st.avisar,
      nudge: () => this.setState({ avisar: true }),
    };
  }
}
</script>
</body>
</html>
