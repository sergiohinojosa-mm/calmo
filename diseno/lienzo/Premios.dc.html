<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Calmo · Premios de la familia</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&amp;family=Fraunces:opsz,wght,SOFT@9..144,300..600,0..100&amp;display=swap">
<style>
body{margin:0}
a{color:#9CC5A1}a:hover{color:#B9DEC3}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #101A15; color: #EEF3EC; font-family: 'Figtree', system-ui, sans-serif;">
  <div style="position: absolute; top: 56px; left: 20px; right: 20px; display: flex; align-items: center; gap: 14px;">
    <a href="Logros.dc.html" aria-label="Volver a mis logros" style="width: 44px; height: 44px; flex: none; border-radius: 50%; background: #1C2B23; display: flex; align-items: center; justify-content: center; color: #EEF3EC;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-variation-settings: 'SOFT' 100, 'opsz' 72; font-weight: 400; font-size: 26px; line-height: 1.15;">Premios de la familia</h1>
  </div>

  <div style="position: absolute; top: 116px; left: 20px; right: 20px; display: flex; align-items: center; justify-content: space-between; gap: 12px;">
    <span style="display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px; background: rgba(185,222,195,0.12); border: 1px solid rgba(185,222,195,0.25); font-size: 15px; font-weight: 600;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B9DEC3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19c0-8 5-14 15-14 0 10-6 15-14 15"></path><path d="M5 19 13 11"></path></svg>
      {{balance}} hojas para premios
    </span>
    <span style="font-size: 12px; color: #8A9B8F;">Mariel</span>
  </div>
  <p style="position: absolute; top: 168px; left: 20px; right: 20px; margin: 0; display: flex; align-items: center; gap: 6px; font-size: 13px; color: #C9D6CB;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9CC5A1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"></path></svg>
    Usar tus hojas no baja tu nivel.
  </p>

  <div style="position: absolute; top: 200px; left: 0; right: 0; bottom: 0; overflow-y: auto; padding: 0 20px 40px; box-sizing: border-box; display: flex; flex-direction: column; gap: 12px;">
    <sc-for list="{{premios}}" as="p" hint-placeholder-count="5">
      <div style="{{p.cardStyle}}">
        <div style="display: flex; align-items: center; gap: 14px;">
          <div style="{{p.artStyle}}">
            <sc-if value="{{p.isPeli}}" hint-placeholder-val="{{false}}">
              <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><rect x="5" y="11" width="30" height="22" rx="4" fill="#E2CC94"></rect><rect x="5" y="6" width="30" height="7" rx="2" fill="#EEF3EC" transform="rotate(-8 5 13)"></rect><path d="M17 17v10l8-5z" fill="#1C2B23"></path></svg>
            </sc-if>
            <sc-if value="{{p.isHelado}}" hint-placeholder-val="{{false}}">
              <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><path d="M13 19h14l-7 17z" fill="#E9B27D"></path><circle cx="16" cy="16" r="6" fill="#F4C9C0"></circle><circle cx="24" cy="16" r="6" fill="#B9DEC3"></circle><circle cx="20" cy="10" r="6" fill="#EEF3EC"></circle></svg>
            </sc-if>
            <sc-if value="{{p.isJuego}}" hint-placeholder-val="{{false}}">
              <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><rect x="4" y="13" width="32" height="17" rx="8.5" fill="#9CC5A1"></rect><path d="M12 18v7M8.5 21.5h7" stroke="#1C2B23" stroke-width="2.4" stroke-linecap="round"></path><circle cx="27" cy="19" r="2" fill="#1C2B23"></circle><circle cx="30" cy="24" r="2" fill="#1C2B23"></circle></svg>
            </sc-if>
            <sc-if value="{{p.isPijamada}}" hint-placeholder-val="{{false}}">
              <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><path d="M5 34L20 8l15 26z" fill="#6FA58A"></path><path d="M20 8l5 26h-10z" fill="#2A4033"></path><path d="M31 6a5 5 0 1 0 4 8 6 6 0 0 1-4-8z" fill="#E9DFC4"></path></svg>
            </sc-if>
            <sc-if value="{{p.isLibro}}" hint-placeholder-val="{{false}}">
              <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true"><path d="M5 10c5-2 10-2 15 1v22c-5-3-10-3-15-1z" fill="#B9DEC3"></path><path d="M35 10c-5-2-10-2-15 1v22c5-3 10-3 15-1z" fill="#E2CC94"></path></svg>
            </sc-if>
          </div>
          <div style="flex: 1; min-width: 0;">
            <p style="margin: 0; font-size: 16px; font-weight: 600; line-height: 1.3;">{{p.name}}</p>
            <p style="margin: 4px 0 0; display: inline-flex; align-items: center; gap: 5px; font-size: 14px; color: #B9DEC3;">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19c0-8 5-14 15-14 0 10-6 15-14 15"></path><path d="M5 19 13 11"></path></svg>
              {{p.cost}} hojas
            </p>
          </div>
        </div>
        <div style="margin-top: 12px; height: 8px; border-radius: 8px; background: rgba(238,243,236,0.07);"><div style="{{p.bar}}"></div></div>
        <div style="margin-top: 12px;">
          <sc-if value="{{p.canBuy}}" hint-placeholder-val="{{true}}">
            <button onClick="{{p.redeem}}" style="width: 100%; height: 56px; border-radius: 999px; border: none; background: #9CC5A1; color: #0F1A14; font-family: inherit; font-size: 17px; font-weight: 600;">¡Lo quiero!</button>
          </sc-if>
          <sc-if value="{{p.isPending}}" hint-placeholder-val="{{false}}">
            <p style="margin: 0; min-height: 52px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 999px; background: rgba(226,204,148,0.14); color: #E2CC94; font-size: 15px; font-weight: 600;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
              Esperando a papá o mamá
            </p>
          </sc-if>
          <sc-if value="{{p.isShort}}" hint-placeholder-val="{{false}}">
            <p style="margin: 0; min-height: 44px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #A9B8AC;">Te faltan {{p.missing}} hojas</p>
          </sc-if>
        </div>
      </div>
    </sc-for>
    <p style="margin: 8px 0 0; text-align: center; font-size: 13px; color: #A9B8AC;">Papá o mamá aprueban cada premio.</p>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const pending = st.pending || {};
    const P = [
      { k: 'peli', name: 'Elegir la película del viernes', cost: 80, tint: 'rgba(226,204,148,0.14)' },
      { k: 'juego', name: 'Media hora más de juego', cost: 100, tint: 'rgba(156,197,161,0.14)' },
      { k: 'helado', name: 'Ir por un helado', cost: 150, tint: 'rgba(233,178,125,0.14)' },
      { k: 'libro', name: 'Libro nuevo', cost: 250, tint: 'rgba(185,222,195,0.14)' },
      { k: 'pijamada', name: 'Pijamada con primas', cost: 400, tint: 'rgba(111,165,138,0.16)' },
    ];
    const spent = P.reduce((a, p) => a + (pending[p.k] ? p.cost : 0), 0);
    const balance = 120 - spent;
    const premios = P.map((p) => {
      const isPending = !!pending[p.k];
      const canBuy = !isPending && balance >= p.cost;
      const pct = isPending ? 100 : Math.min(100, Math.round((balance / p.cost) * 100));
      return {
        name: p.name,
        cost: p.cost,
        missing: Math.max(0, p.cost - balance),
        isPending,
        canBuy,
        isShort: !isPending && !canBuy,
        isPeli: p.k === 'peli', isHelado: p.k === 'helado', isJuego: p.k === 'juego', isPijamada: p.k === 'pijamada', isLibro: p.k === 'libro',
        cardStyle: 'background: #1C2B23; border-radius: 24px; padding: 16px; border: 1px solid ' + (canBuy ? 'rgba(156,197,161,0.45)' : 'rgba(238,243,236,0.06)') + ';',
        artStyle: 'width: 64px; height: 64px; flex: none; border-radius: 20px; display: flex; align-items: center; justify-content: center; background: ' + p.tint + ';',
        bar: 'height: 8px; border-radius: 8px; width: ' + pct + '%; background: ' + (isPending ? '#E2CC94' : canBuy ? '#9CC5A1' : 'rgba(156,197,161,0.45)') + ';',
        redeem: () => this.setState({ pending: Object.assign({}, pending, { [p.k]: true }) }),
      };
    });
    return { balance, premios };
  }
}
</script>
</body>
</html>
