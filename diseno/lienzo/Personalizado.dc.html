<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Calmo · Crear ejercicio</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&amp;family=Fraunces:opsz,wght,SOFT@9..144,300..600,0..100&amp;display=swap">
<style>
body{margin:0}
a{color:#9CC5A1}a:hover{color:#B9DEC3}
input::placeholder{color:#8A9B8F}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #101A15; color: #EEF3EC; font-family: 'Figtree', system-ui, sans-serif; box-sizing: border-box; padding: 56px 20px 0;">
  <div style="display: flex; align-items: center; gap: 14px;">
    <a href="Catalogo.dc.html" aria-label="Volver a ejercicios" style="width: 44px; height: 44px; flex: none; border-radius: 50%; background: #1C2B23; display: flex; align-items: center; justify-content: center; color: #EEF3EC;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
    </a>
    <h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-variation-settings: 'SOFT' 100, 'opsz' 72; font-weight: 400; font-size: 28px;">Crear ejercicio</h1>
  </div>

  <label style="display: block; margin-top: 20px;">
    <span style="display: block; font-size: 13px; color: #A9B8AC; margin-bottom: 8px;">Nombre</span>
    <input type="text" placeholder="Mi respiración de la tarde" style="width: 100%; box-sizing: border-box; height: 50px; padding: 0 16px; border-radius: 16px; border: 1px solid rgba(238,243,236,0.12); background: #16231C; color: #EEF3EC; font-family: inherit; font-size: 16px;">
  </label>

  <div style="margin-top: 16px; background: #1C2B23; border: 1px solid rgba(238,243,236,0.06); border-radius: 24px; padding: 14px 16px; display: flex; align-items: center; gap: 16px;">
    <div role="img" aria-label="{{ringLabel}}" style="{{ringStyle}}">
      <div style="width: 70px; height: 70px; border-radius: 50%; background: #1C2B23; display: flex; flex-direction: column; align-items: center; justify-content: center;">
        <span style="font-family: 'Fraunces', Georgia, serif; font-variation-settings: 'SOFT' 100; font-size: 20px;">{{cycle}}</span>
        <span style="font-size: 11px; color: #8A9B8F;">por ciclo</span>
      </div>
    </div>
    <div style="flex: 1; min-width: 0;">
      <p style="margin: 0; font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums;">{{pattern}}</p>
      <p style="margin: 4px 0 0; font-size: 13px; line-height: 1.5; color: #A9B8AC;">{{summary}}</p>
    </div>
  </div>

  <div style="margin-top: 14px; display: flex; flex-direction: column; gap: 8px;">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
      <div style="display: flex; align-items: center; gap: 12px; min-height: 60px; padding: 6px 8px 6px 16px; border-radius: 18px; background: #16231C; box-sizing: border-box;">
        <span style="{{r.dot}}"></span>
        <span style="flex: 1; font-size: 15px; font-weight: 500;">{{r.label}}</span>
        <button onClick="{{r.dec}}" aria-label="{{r.decLabel}}" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(238,243,236,0.12); background: transparent; color: #EEF3EC; display: flex; align-items: center; justify-content: center;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
        </button>
        <span style="width: 56px; text-align: center; font-family: 'Fraunces', Georgia, serif; font-variation-settings: 'SOFT' 100; font-size: 22px; font-variant-numeric: tabular-nums;">{{r.val}}</span>
        <button onClick="{{r.inc}}" aria-label="{{r.incLabel}}" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid rgba(238,243,236,0.12); background: transparent; color: #EEF3EC; display: flex; align-items: center; justify-content: center;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
        </button>
      </div>
    </sc-for>
  </div>

  <p style="margin: 14px 0 0; display: flex; align-items: center; gap: 8px; font-size: 14px; color: #A9B8AC;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h11a3 3 0 1 0-3-3M3 12h16a3 3 0 1 1-3 3M3 16h7"></path></svg>
    En Calmo todo se respira por la nariz.
  </p>

  <sc-if value="{{notSaved}}" hint-placeholder-val="{{true}}">
    <button onClick="{{save}}" style="position: absolute; left: 20px; right: 20px; bottom: 34px; display: flex; align-items: center; justify-content: center; height: 58px; border-radius: 999px; border: none; background: #9CC5A1; color: #0F1A14; font-family: inherit; font-size: 17px; font-weight: 600;">Guardar ejercicio</button>
  </sc-if>
  <sc-if value="{{saved}}" hint-placeholder-val="{{false}}">
    <div role="status" style="position: absolute; left: 20px; right: 20px; bottom: 34px; display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 18px; background: rgba(156,197,161,0.14); color: #B9DEC3; font-size: 15px; font-weight: 600;">
        <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#9CC5A1"></circle><path d="M8 12.5l2.5 2.5 5.5-6" fill="none" stroke="#0F1A14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        Guardado en Tus ejercicios
      </div>
      <a href="Catalogo.dc.html" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 999px; background: #9CC5A1; color: #0F1A14; font-size: 17px; font-weight: 600; text-decoration: none;">Ver mis ejercicios</a>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const v = st.v ?? { in: 4, hold: 4, out: 6, wait: 2 };
    const fmt = (n) => (Number.isInteger(n) ? String(n) : n.toFixed(1));
    const R = [
      ['in', 'Inhala', '#B9DEC3', 1],
      ['hold', 'Retén', '#E2CC94', 0],
      ['out', 'Exhala', '#6FA58A', 1],
      ['wait', 'Espera', '#7C8F84', 0],
    ];
    const set = (k, n) => { const nv = Object.assign({}, v); nv[k] = n; this.setState({ v: nv }); };
    const rows = R.map(([k, label, col, min]) => ({
      label,
      val: fmt(v[k]) + ' s',
      dot: 'width: 10px; height: 10px; flex: none; border-radius: 50%; background: ' + col + ';',
      decLabel: 'Restar medio segundo a ' + label.toLowerCase(),
      incLabel: 'Sumar medio segundo a ' + label.toLowerCase(),
      dec: () => set(k, Math.max(min, Math.round((v[k] - 0.5) * 2) / 2)),
      inc: () => set(k, Math.min(20, Math.round((v[k] + 0.5) * 2) / 2)),
    }));
    const total = v.in + v.hold + v.out + v.wait;
    const bpm = total > 0 ? Math.round((60 / total) * 10) / 10 : 0;
    const p1 = (v.in / total) * 100;
    const p2 = p1 + (v.hold / total) * 100;
    const p3 = p2 + (v.out / total) * 100;
    const r1 = Math.round(p1 * 10) / 10, r2 = Math.round(p2 * 10) / 10, r3 = Math.round(p3 * 10) / 10;
    return {
      rows,
      saved: !!st.saved,
      notSaved: !st.saved,
      save: () => this.setState({ saved: true }),
      cycle: fmt(total) + ' s',
      pattern: fmt(v.in) + ' · ' + fmt(v.hold) + ' · ' + fmt(v.out) + ' · ' + fmt(v.wait) + ' = ' + fmt(total) + ' s',
      summary: fmt(bpm) + ' respiraciones por minuto · por la nariz',
      ringLabel: 'Proporción del ciclo: inhala ' + fmt(v.in) + ' s, retén ' + fmt(v.hold) + ' s, exhala ' + fmt(v.out) + ' s, espera ' + fmt(v.wait) + ' s',
      ringStyle: 'width: 92px; height: 92px; flex: none; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: conic-gradient(#B9DEC3 0 ' + r1 + '%, #E2CC94 ' + r1 + '% ' + r2 + '%, #6FA58A ' + r2 + '% ' + r3 + '%, #7C8F84 ' + r3 + '% 100%);',
    };
  }
}
</script>
</body>
</html>
