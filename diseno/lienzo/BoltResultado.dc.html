<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Calmo · Resultado de BOLT</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&amp;family=Fraunces:opsz,wght,SOFT@9..144,300..600,0..100&amp;display=swap">
<style>
body{margin:0}
a{color:#9CC5A1}a:hover{color:#B9DEC3}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #101A15; color: #EEF3EC; font-family: 'Figtree', system-ui, sans-serif; box-sizing: border-box; padding: 56px 20px 0;">
  <a href="{{closeHref}}" aria-label="Cerrar" style="width: 44px; height: 44px; border-radius: 50%; background: #1C2B23; display: flex; align-items: center; justify-content: center; color: #A9B8AC;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg>
  </a>

  <p style="margin: 22px 0 0; font-size: 14px; color: #A9B8AC; text-align: center;">{{heading}}</p>
  <p style="margin: 4px 0 0; text-align: center; font-family: 'Fraunces', Georgia, serif; font-variation-settings: 'SOFT' 100, 'opsz' 144; font-size: 88px; line-height: 1;">26 <span style="font-family: 'Figtree', sans-serif; font-size: 22px; color: #A9B8AC;">s</span></p>
  <sc-if value="{{showDelta}}" hint-placeholder-val="{{true}}">
    <p style="margin: 8px 0 0; text-align: center;">
      <span style="display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: rgba(156,197,161,0.16); color: #B9DEC3; font-size: 13px; font-weight: 500;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M6 11l6-6 6 6"></path></svg>
        +2 s vs. la anterior
      </span>
    </p>
  </sc-if>
  <sc-if value="{{isPrimera}}" hint-placeholder-val="{{false}}">
    <p style="margin: 8px 0 0; text-align: center; font-size: 14px; color: #B9DEC3;">Este es tu punto de partida. Desde aquí vas a ver cómo mejoras.</p>
  </sc-if>

  <div style="margin-top: 26px; background: #1C2B23; border: 1px solid rgba(238,243,236,0.06); border-radius: 24px; padding: 16px;">
    <div style="position: relative; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px;">
      <div style="height: 10px; border-radius: 6px 2px 2px 6px; background: #4A5A50;"></div>
      <div style="height: 10px; border-radius: 2px; background: #6B7A70;"></div>
      <div style="height: 10px; border-radius: 2px; background: #9CC5A1;"></div>
      <div style="height: 10px; border-radius: 2px; background: #B9DEC3;"></div>
      <div style="height: 10px; border-radius: 2px 6px 6px 2px; background: #E2CC94;"></div>
      <span aria-hidden="true" style="position: absolute; top: -5px; left: 52%; width: 20px; height: 20px; margin-left: -10px; border-radius: 50%; background: #EEF3EC; border: 3px solid #101A15;"></span>
    </div>
    <div style="margin-top: 8px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; font-size: 11px; color: #8A9B8F; text-align: center;">
      <span>Inicio<br>&lt;10</span><span>Base<br>10–20</span><span style="color: #B9DEC3; font-weight: 600;">Intermedio<br>20–30</span><span>Avanzado<br>30–40</span><span>Meta<br>40+</span>
    </div>
    <div style="margin-top: 14px; padding-top: 12px; border-top: 1px solid rgba(238,243,236,0.06); display: flex; justify-content: space-between; font-size: 13px;">
      <span style="color: #A9B8AC;">Tu meta: 40 s</span>
      <span>Te faltan 14 s</span>
    </div>
  </div>

  <div style="margin-top: 12px; background: #16231C; border-radius: 20px; padding: 6px 16px;">
    <div style="display: flex; align-items: center; justify-content: space-between; min-height: 56px; border-bottom: 1px solid rgba(238,243,236,0.06);">
      <div>
        <p style="margin: 0; font-size: 15px;">Medición de la mañana</p>
        <p style="margin: 2px 0 0; font-size: 12px; color: #8A9B8F;">Al despertar, antes de cualquier actividad</p>
      </div>
      <button role="switch" aria-checked="{{morningChecked}}" aria-label="Medición de la mañana" onClick="{{toggleMorning}}" style="flex: none; width: 60px; height: 44px; border: none; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center;"><span style="{{track}}"><span style="{{knob}}"></span></span></button>
    </div>
    <label style="display: block; padding: 12px 0 10px;">
      <span style="display: block; font-size: 12px; color: #8A9B8F; margin-bottom: 6px;">Nota (opcional)</span>
      <input type="text" placeholder="Dormí bien, nariz despejada" style="width: 100%; box-sizing: border-box; height: 44px; border-radius: 14px; border: 1px solid rgba(238,243,236,0.10); background: #101A15; color: #EEF3EC; padding: 0 14px; font-family: inherit; font-size: 15px;">
    </label>
  </div>

  <div style="position: absolute; left: 20px; right: 20px; bottom: 40px; display: flex; flex-direction: column; gap: 10px;">
    <a href="{{saveHref}}" style="display: flex; align-items: center; justify-content: center; height: 56px; border-radius: 999px; background: #9CC5A1; color: #0F1A14; font-size: 17px; font-weight: 600; text-decoration: none;">{{saveLabel}}</a>
    <a href="{{repeatHref}}" style="display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 999px; border: 1px solid rgba(238,243,236,0.14); color: #A9B8AC; font-size: 15px; text-decoration: none;">Repetir medición</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"primera":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const on = (this.state && this.state.morning) ?? true;
    const primera = !!this.props.primera;
    return {
      heading: primera ? 'Tu primer BOLT' : 'Tu BOLT de hoy',
      showDelta: !primera,
      isPrimera: primera,
      closeHref: primera ? 'Main.dc.html' : 'Perfil.dc.html',
      saveHref: primera ? 'Main.dc.html' : 'Perfil.dc.html',
      saveLabel: primera ? 'Guardar y empezar' : 'Guardar',
      repeatHref: primera ? 'BoltMedicionInicial.dc.html' : 'BoltMedicion.dc.html',
      morningChecked: on ? 'true' : 'false',
      toggleMorning: () => this.setState({ morning: !on }),
      track: 'width: 52px; height: 32px; box-sizing: border-box; border-radius: 999px; padding: 3px; display: flex; justify-content: ' + (on ? 'flex-end' : 'flex-start') + '; background: ' + (on ? '#9CC5A1' : 'rgba(238,243,236,0.14)') + ';',
      knob: 'width: 26px; height: 26px; border-radius: 50%; background: ' + (on ? '#0F1A14' : '#A9B8AC') + ';',
    };
  }
}
</script>
</body>
</html>
